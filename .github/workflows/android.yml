name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # gradle/gradle-daemon-jvm.properties pede JDK 25 para o daemon
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Valida o gradle-wrapper.jar e faz cache das dependências
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Release keystore (opcional)
        env:
          KEYSTORE_BASE64: ${{ secrets.OHM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OHM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OHM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OHM_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/ohm-release.jks
          {
            echo "storeFile=keystore/ohm-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Tags exigem assinatura de release
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('keystore.properties') == ''
        run: |
          echo "::error::Faltam os secrets OHM_KEYSTORE_* — uma release assinada com a chave debug não atualiza instalações existentes."
          exit 1

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :companion:testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
          if-no-files-found: ignore

      - name: APKs
        uses: actions/upload-artifact@v5
        with:
          name: apks
          path: |
            app/build/outputs/apk/**/*.apk
            companion/build/outputs/apk/**/*.apk

      - name: Remove keystore
        if: always()
        run: rm -rf keystore keystore.properties

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: apks
          path: apks

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir out
          cp apks/app/build/outputs/apk/release/app-release.apk "out/Ohm-${TAG#v}.apk"
          cp apks/companion/build/outputs/apk/release/companion-release.apk "out/OhmCompanion-${TAG#v}.apk"
          gh release create "$TAG" out/*.apk --repo "$GITHUB_REPOSITORY" --title "Ohm $TAG" --generate-notes
